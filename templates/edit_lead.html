<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Lead | ClientFlow CRM</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header>
    <h1>ClientFlow CRM</h1>
    <p>Edit lead information and pipeline status.</p>
</header>

<main>

    <section>

        <h2>Edit Lead</h2>

        <form method="POST">

            <div>
                <label for="name">Client Name</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    value="{{ lead['name'] }}"
                    required
                >
            </div>

            <div>
                <label for="company">Company</label>

                <input
                    type="text"
                    id="company"
                    name="company"
                    value="{{ lead['company'] }}"
                >
            </div>

            <div>
                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    value="{{ lead['email'] }}"
                >
            </div>

            <div>
                <label for="status">Status</label>

                <select id="status" name="status">

                    {% for status in ["New Lead", "Qualified", "Proposal", "Won"] %}

                        <option
                            value="{{ status }}"
                            {% if lead["status"] == status %}selected{% endif %}
                        >
                            {{ status }}
                        </option>

                    {% endfor %}

                </select>
            </div>

            <div>
                <label for="priority">Priority</label>

                <select id="priority" name="priority">

                    {% for priority in ["Low", "Medium", "High"] %}

                        <option
                            value="{{ priority }}"
                            {% if lead["priority"] == priority %}selected{% endif %}
                        >
                            {{ priority }}
                        </option>

                    {% endfor %}

                </select>
            </div>

            <button type="submit">
                Save Changes
            </button>

            <a href="{{ url_for('dashboard') }}">
                Cancel
            </a>

        </form>

    </section>

</main>

</body>

</html>
