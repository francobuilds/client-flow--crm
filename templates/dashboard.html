<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClientFlow CRM</title>
</head>

<body>
    <header>
        <h1>ClientFlow CRM</h1>
        <p>Manage leads, clients, and pipeline activity.</p>
    </header>

    <main>
        <section>
            <h2>Pipeline Overview</h2>

            <div>
                <h3>New Leads</h3>
                <p>0</p>
            </div>

            <div>
                <h3>Qualified</h3>
                <p>0</p>
            </div>

            <div>
                <h3>Proposal</h3>
                <p>0</p>
            </div>

            <div>
                <h3>Won</h3>
                <p>0</p>
            </div>
        </section>

        <section>
            <h2>Recent Leads</h2>

            <table>
                <thead>
                    <tr>
                        <th>Client</th>
                        <th>Company</th>
                        <th>Status</th>
                        <th>Priority</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td colspan="4">No leads yet.</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
</body>
</html>
